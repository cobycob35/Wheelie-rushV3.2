<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Wheelie Rush V3.2</title>
<style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;left:10px;top:8px;font-weight:900;text-shadow:2px 2px #000;pointer-events:none}#panel{position:fixed;right:8px;top:8px;background:#000c;padding:7px;border-radius:12px;text-align:right}button,select{font-size:14px;padding:8px;border:0;border-radius:9px;margin:2px}.controls{position:fixed;bottom:10px;width:100%;display:flex;justify-content:space-around}.ctrl{width:23vw;height:62px;font-weight:900;font-size:15px}.wheel{background:#ffd35c}.key{background:#ff9d32}#battery{display:inline-block;width:70px;height:17px;border:2px solid #fff;border-radius:4px;vertical-align:middle;padding:2px}#bar{height:100%;width:100%;background:#4ddd65;border-radius:2px}#msg{position:fixed;top:30%;width:100%;text-align:center;font-size:28px;font-weight:1000;text-shadow:3px 3px #000;pointer-events:none}</style></head><body>
<canvas id="c"></canvas><div id="hud">WHEELIE RUSH V3.2 🏍️<br><span id="stats"></span><br><span id="status"></span></div>
<div id="panel"><span id="batwrap">🔋 <span id="battery"><span id="bar"></span></span> <b id="pct">100%</b><br></span><select id="ride"></select><button class="key" id="key">🔑 START</button></div>
<div id="msg"></div><div class="controls"><button class="ctrl" id="brake">BRAKE</button><button class="ctrl wheel" id="wheel">WHEELIE</button><button class="ctrl" id="trick">TRICK</button><button class="ctrl" id="gas">GAS</button></div>
<script>
const C=document.querySelector('#c'),x=C.getContext('2d');let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight}resize();addEventListener('resize',resize);
const rides=[];for(let i=1;i<=10;i++)rides.push({n:`Volt E-Bike ${i}`,t:'E-BIKE',m:42+i,c:`hsl(${190+i*10} 75% 50%)`});for(let i=1;i<=10;i++)rides.push({n:`MX Dirt Bike ${i}`,t:'DIRT BIKE',m:53+i*1.3,c:`hsl(${i*28} 85% 50%)`});for(let i=1;i<=10;i++)rides.push({n:`Turbo Quad ${i}`,t:'TUNED QUAD',m:63+i*1.5,c:`hsl(${295+i*8} 80% 52%)`});
let idx=10,speed=0,angle=0,dist=0,score=0,battery=100,started=false,gas=false,brake=false,wheel=false,trick=false,last=performance.now(),audio=null,engineTimer=0;
const sel=document.querySelector('#ride');rides.forEach((r,i)=>sel.add(new Option(`${i+1}. ${r.n}`,i)));sel.value=10;const R=()=>rides[idx];
function AC(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function beep(freq,dur=.1,type='sine',vol=.08){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(audio.destination);o.start();o.stop(t+dur)}
function starter(){AC();beep(95,.08,'square',.09);setTimeout(()=>beep(75,.12,'sawtooth',.1),90);setTimeout(()=>beep(125,.16,'sawtooth',.1),210)}
function motorSound(){if(!audio||!started||battery<=0)return;let now=performance.now();if(now-engineTimer<45)return;engineTimer=now;let r=R(),o=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;if(r.t==='DIRT BIKE'){o.type='sawtooth';o.frequency.value=58+speed*5+(gas?28:0);gain.gain.value=.055}else if(r.t==='E-BIKE'){o.type='sine';o.frequency.value=210+speed*10;gain.gain.value=.028}else{o.type='square';o.frequency.value=65+speed*4;gain.gain.value=.045}o.connect(gain).connect(audio.destination);o.start();o.stop(t+.055);
if(r.t==='DIRT BIKE'&&gas&&Math.random()<.34){
 let intake=audio.createOscillator(),ig=audio.createGain();
 intake.type='triangle';
 intake.frequency.setValueAtTime(145+speed*2.2,t);
 intake.frequency.exponentialRampToValueAtTime(85+speed,t+.045);
 ig.gain.setValueAtTime(.025,t);
 ig.gain.exponentialRampToValueAtTime(.001,t+.05);
 intake.connect(ig).connect(audio.destination);intake.start();intake.stop(t+.055)
}}
function flash(s){let m=document.querySelector('#msg');m.textContent=s;clearTimeout(flash.t);flash.t=setTimeout(()=>m.textContent='',800)}
document.querySelector('#key').onclick=()=>{AC();if(R().t!=='DIRT BIKE'){flash('🔑 Key is for dirt bikes only');return}if(battery<=0){flash('🔴 BATTERY DEAD');beep(45,.25,'square');return}started=!started;if(started){starter();flash('🏍️ BIKE STARTED')}else{beep(65,.12,'square');flash('BIKE OFF')}};
function bind(id,k){let e=document.querySelector('#'+id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();AC();if(k==='gas')gas=true;else if(k==='brake')brake=true;else if(k==='wheel')wheel=true;else if(k==='trick')trick=true});['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,()=>{if(k==='gas')gas=false;else if(k==='brake')brake=false;else if(k==='wheel')wheel=false;else if(k==='trick')trick=false}))}
bind('gas','gas');bind('brake','brake');bind('wheel','wheel');bind('trick','trick');
addEventListener('keydown',e=>{AC();if(e.code==='ArrowRight')gas=true;if(e.code==='ArrowLeft')brake=true;if(e.code==='Space')wheel=true;if(e.code==='KeyT')trick=true;if(e.code==='KeyK')document.querySelector('#key').click()});addEventListener('keyup',e=>{if(e.code==='ArrowRight')gas=false;if(e.code==='ArrowLeft')brake=false;if(e.code==='Space')wheel=false;if(e.code==='KeyT')trick=false});
sel.onchange=()=>{idx=+sel.value;speed=angle=0;started=R().t!=='DIRT BIKE';battery=100;updatePanel()};function updatePanel(){let dirt=R().t==='DIRT BIKE';document.querySelector('#key').style.display=dirt?'inline-block':'none';document.querySelector('#batwrap').style.display=dirt?'inline':'none';let b=document.querySelector('#bar');b.style.width=battery+'%';b.style.background=battery<=0?'#e52323':battery<=25?'#ff9418':'#48d15d';document.querySelector('#pct').textContent=Math.ceil(battery)+'%';document.querySelector('#key').textContent=started?'🔑 STOP':'🔑 START'}
function terrain(z){return H*.73+Math.sin(z*.008)*18+Math.sin(z*.023)*6-(Math.max(0,Math.sin(z*.0025))**20)*55}
function bg(){let cam=dist*12,q=x.createLinearGradient(0,0,0,H);q.addColorStop(0,'#4b3975');q.addColorStop(.55,'#ed855c');q.addColorStop(1,'#9c5d35');x.fillStyle=q;x.fillRect(0,0,W,H);x.fillStyle='#704735';x.beginPath();x.moveTo(0,H);for(let X=0;X<=W;X+=7)x.lineTo(X,terrain(X+cam));x.lineTo(W,H);x.fill();x.strokeStyle='#dca05d';x.lineWidth=5;x.beginPath();for(let X=0;X<=W;X+=7){let y=terrain(X+cam)-3;X?x.lineTo(X,y):x.moveTo(X,y)}x.stroke()}
function wh(px,py,r){x.fillStyle='#111';x.beginPath();x.arc(px,py,r,0,7);x.fill();x.strokeStyle='#bbb';x.lineWidth=3;x.beginPath();x.arc(px,py,r-6,0,7);x.stroke();x.strokeStyle='#888';x.lineWidth=1;for(let a=0;a<6.3;a+=.45){x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*(r-7),py+Math.sin(a)*(r-7));x.stroke()}}
function realisticBike(cx,cy,r){x.save();x.translate(cx,cy);x.rotate(-angle);wh(-51,22,24);wh(53,22,24);
x.strokeStyle='#b9b9b9';x.lineWidth=5;x.beginPath();x.moveTo(-51,22);x.lineTo(-7,6);x.lineTo(24,-22);x.lineTo(53,22);x.stroke();x.strokeStyle=r.c;x.lineWidth=7;x.beginPath();x.moveTo(-8,7);x.lineTo(-27,-26);x.lineTo(22,-22);x.lineTo(-8,7);x.stroke();
x.fillStyle='#4b4b4b';x.roundRect(-18,-4,34,29,5);x.fill();x.fillStyle='#252525';x.fillRect(-10,1,19,19);x.strokeStyle='#aaa';x.lineWidth=4;x.beginPath();x.moveTo(12,15);x.quadraticCurveTo(-4,28,-42,2);x.stroke();x.fillStyle='#aaa';x.roundRect(-50,-3,25,8,3);x.fill();
x.fillStyle=r.c;x.beginPath();x.moveTo(-30,-33);x.lineTo(15,-35);x.lineTo(31,-19);x.lineTo(-15,-13);x.closePath();x.fill();x.fillStyle='#111';x.roundRect(-45,-41,61,9,4);x.fill();
let bend=Math.max(0,angle-.16)*40;x.fillStyle=r.c;x.beginPath();x.moveTo(-39,-38);x.quadraticCurveTo(-61,-47-bend*.3,-83,-35-bend);x.lineTo(-79,-27-bend*.82);x.quadraticCurveTo(-58,-34-bend*.15,-36,-30);x.closePath();x.fill();
x.beginPath();x.moveTo(29,-25);x.quadraticCurveTo(54,-36,76,-20);x.lineTo(70,-13);x.quadraticCurveTo(51,-24,31,-16);x.fill();x.fillStyle='#eee';x.fillRect(17,-39,19,20);x.fillStyle='#222';x.font='bold 12px Arial';x.fillText(idx-9,21,-24);
x.strokeStyle='#333';x.lineWidth=4;x.beginPath();x.moveTo(25,-31);x.lineTo(34,-51);x.lineTo(48,-53);x.stroke();
// rider with helmet, torso, bent arms and legs
x.fillStyle='#202020';x.beginPath();x.arc(2,-69,11,0,7);x.fill();x.fillStyle='#eee';x.fillRect(6,-72,11,4);x.strokeStyle='#242424';x.lineWidth=9;x.beginPath();x.moveTo(0,-57);x.lineTo(-10,-33);x.lineTo(5,-19);x.moveTo(-4,-53);x.lineTo(23,-43);x.lineTo(39,-49);x.moveTo(-7,-31);x.lineTo(-29,-2);x.lineTo(-48,13);x.stroke();x.restore()}
function simpleVehicle(cx,cy,r){x.save();x.translate(cx,cy);x.rotate(-angle);wh(-45,21,22);wh(45,21,22);x.strokeStyle=r.c;x.lineWidth=8;x.beginPath();x.moveTo(-45,21);x.lineTo(-7,-15);x.lineTo(45,21);x.lineTo(0,21);x.lineTo(-45,21);x.stroke();x.fillStyle='#222';x.fillRect(-15,-13,28,25);x.restore()}
function loop(t){let dt=Math.min(.03,(t-last)/1000);last=t,r=R();let canGo=r.t!=='DIRT BIKE'||(started&&battery>0);if(canGo){speed+=((gas?34:0)-(brake?50:7))*dt;speed=Math.max(0,Math.min(r.m,speed));let target=wheel&&speed>7?Math.min(1.05,.24+speed/92):0;angle+=(target-angle)*4.3*dt;if(angle>.35&&speed>9)score+=speed*dt*.6;dist+=speed*dt/3.6;if(r.t==='DIRT BIKE'&&started){battery-=dt*(gas?.12:.018);if(battery<=0){battery=0;started=false;speed*=.97;flash('🔴 BATTERY DEAD')}}}else{speed=Math.max(0,speed-20*dt);angle+=(0-angle)*4*dt}motorSound();bg();let bx=W*.43,by=terrain(bx+dist*12)-30;r.t==='DIRT BIKE'?realisticBike(bx,by,r):simpleVehicle(bx,by,r);document.querySelector('#stats').innerHTML=`${r.n} • ${speed.toFixed(0)} MPH<br>⭐ ${Math.floor(score)} &nbsp; 📍 ${Math.floor(dist)}m`;document.querySelector('#status').textContent=r.t==='DIRT BIKE'?(started?'🟢 ENGINE ON':'⚫ ENGINE OFF • tap START'):'READY';updatePanel();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
